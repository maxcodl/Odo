name: Build & Release Stable APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build stable release APK & Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches all history so we can generate an accurate changelog

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts') }}
          restore-keys: gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/odo-release.jks

      - name: Build release APK & Bundle (signed)
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/app/odo-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease :app:assembleRelease --no-daemon

      - name: Rename Build Artifacts
        run: |
          TAG=${GITHUB_REF_NAME:-stable}
          cp app/build/outputs/apk/release/*.apk Odo-${TAG}-release.apk
          cp app/build/outputs/bundle/release/*.aab Odo-${TAG}-release.aab

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Odo-release-artifacts
          path: |
            Odo-*-release.apk
            Odo-*-release.aab

      - name: Find previous stable tag
        id: prev_tag
        run: |
          # Only match real stable tags (v1.0.3, v1.0.4, ...), excluding beta-* tags,
          # and excluding the tag we're releasing right now.
          PREV_TAG=$(git tag --list 'v*' --sort=-creatordate | grep -v "^${GITHUB_REF_NAME}$" | head -n 1)
          echo "prev_tag=${PREV_TAG}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        run: |
          if [ -n "${{ steps.prev_tag.outputs.prev_tag }}" ]; then
            RANGE="${{ steps.prev_tag.outputs.prev_tag }}..HEAD"
          else
            RANGE="HEAD"
          fi
          {
            echo "changelog<<EOF"
            git log $RANGE --pretty=format:'- %s (%h)' --no-merges
            echo ""
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Odo ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            ${{ steps.prev_tag.outputs.prev_tag && format('**Changes since {0}:**', steps.prev_tag.outputs.prev_tag) || '**Initial release**' }}

            ### What's Changed
            ${{ steps.changelog.outputs.changelog }}
          files: |
            Odo-*-release.apk
            Odo-*-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
