name: Build Beta APK
on:
  push:
    branches:
      - "beta"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    name: Build beta APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need full history so we can diff commits since last beta tag

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts') }}
          restore-keys: gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/odo-release.jks

      - name: Build release APK (signed)
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/app/odo-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Set build variables
        id: vars
        run: |
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          BUILD_NUM=${{ github.run_number }}
          TAG="beta-v${VERSION_NAME}-b${BUILD_NUM}"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Find previous beta tag
        id: prev_tag
        run: |
          PREV_TAG=$(git tag --list 'beta-*' --sort=-creatordate | head -n 1)
          echo "prev_tag=${PREV_TAG}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        run: |
          if [ -n "${{ steps.prev_tag.outputs.prev_tag }}" ]; then
            RANGE="${{ steps.prev_tag.outputs.prev_tag }}..HEAD"
          else
            RANGE="HEAD"
          fi
          {
            echo "changelog<<EOF"
            git log $RANGE --pretty=format:'- %s (%h)' --no-merges
            echo ""
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/*.apk "Odo-${{ steps.vars.outputs.tag }}-release.apk"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Odo-beta-release
          path: Odo-*-release.apk

      - name: Create GitHub Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Odo Beta v${{ steps.vars.outputs.version_name }} (build ${{ github.run_number }})"
          tag_name: "${{ steps.vars.outputs.tag }}"
          draft: false
          prerelease: true
          body: |
            **Commit:** `${{ steps.vars.outputs.short_sha }}`

            ### What's Changed
            ${{ steps.changelog.outputs.changelog }}
          files: |
            Odo-*-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
